<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>惑星サイズ比較ツール</title>
    <style>
        /* 全体の基本スタイル */
        body {
            font-family: sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .form-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* セレクトボックスとボタンの共通スタイル */
        select,
        button {
            width: 100%;
            /* 横幅いっぱいに広げる */
            padding: 12px;
            /* スマホでもタップしやすいように高さを確保 */
            font-size: 1rem;
            /* 読みやすいフォントサイズ */
            border: 1px solid #ccc;
            border-radius: 6px;
            /* 角を少し丸くする */
            box-sizing: border-box;
        }

        /* ボタンの強調スタイル */
        button {
            background-color: #0070f3;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0051a2;
        }

        /* 結果表示エリアのスタイル */
        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 6px;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <h1>惑星サイズ比較ツール</h1>

    <!-- 縦並びにするためのコンテナ（枠組み）で囲む -->
    <div class="form-container">
        <select id="select1">
            <option value="">読み込み中...</option>
        </select>
        <select id="select2">
            <option value="">読み込み中...</option>
        </select>
        <button id="callButton">サイズを比較！</button>
    </div>

    <div id="result">
        ここに結果が表示されます
    </div>

    <script>
        const select1 = document.getElementById('select1');
        const select2 = document.getElementById('select2');
        const callButton = document.getElementById('callButton');
        const resultDiv = document.getElementById('result');

        // ページ読み込み時に惑星一覧を取得してプルダウンにセット
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/.netlify/functions/getPlanets');
                if (!response.ok) {
                    throw new Error('惑星一覧の取得に失敗しました');
                }
                const planets = await response.json();

                // プルダウンを初期化
                select1.innerHTML = '';
                select2.innerHTML = '';

                // 取得した惑星一覧をプルダウンに追加
                planets.forEach((planet) => {
                    const option1 = document.createElement('option');
                    option1.value = planet.name;
                    option1.textContent = `${planet.name} (${planet.englishName})`;

                    const option2 = option1.cloneNode(true);

                    select1.appendChild(option1);
                    select2.appendChild(option2);
                });

                // デフォルトの選択値を設定（例: 1つ目を地球、2つ目を火星）
                if (planets.length > 3) {
                    select1.value = '地球';
                    select2.value = '火星';
                }

            } catch (error) {
                resultDiv.textContent = `初期化エラー: ${error.message}`;
            }
        });

        // ボタンクリック時の処理
        callButton.addEventListener('click', async () => {
            const name1 = select1.value;
            const name2 = select2.value;

            if (!name1 || !name2) {
                alert('惑星を選択してください');
                return;
            }

            resultDiv.textContent = '通信中...';

            try {
                const response = await fetch('/.netlify/functions/execute', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name1: name1, name2: name2 })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || 'サーバーエラーが発生しました');
                }

                const data = await response.json();

                // 画面に結果を表示
                resultDiv.innerHTML = `
                    <p style="margin: 5px 0 0 0;">${name1}の半径は ${data.radius1} です。</p>
                    <p style="margin: 5px 0 0 0;">${name2}の半径は ${data.radius2} です。</p>
                    <p style="margin: 5px 0 0 0;">${name1}を ${data.ratio} 倍すると${name2}ですね。</p>
                `;
            } catch (error) {
                resultDiv.textContent = `エラー: ${error.message}`;
            }
        });
    </script>
</body>

</html>
